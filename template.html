<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill 农场</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<style>
:root{
  --bg:#fff4ec; --card:#fffdfb; --sunk:#fbeee4; --ink:#4a332b; --mut:#9a8077; --line:#f3dfd2;
  --accent:#f0997b; --petal:#f0997b; --petal-c:#fac775; --leaf:#9cc46a; --stem:#86b35a; --soil:#e8cdb8; --seed:#b98a6a;
  --u:#f5c4b3; --u-bg:#fde4da; --u-ink:#9a4a32;
  --p:#fac775; --p-bg:#fdebc4; --p-ink:#875a0b;
  --g:#c0dd97; --g-bg:#e6f2d4; --g-ink:#4c6e26;
  --a:#f0997b; --a-bg:#fcd9cb; --a-ink:#a3432a;
  --b:#c8c0ec; --b-bg:#ebe7fb; --b-ink:#5a4e9c;
  --c:#b5d6ee; --c-bg:#e1eff9; --c-ink:#2f6488;
  --win-off:#cdb3a6; --win-on:#ffd25e; --house:#fffaf5; --roof:#f0997b; --door:#e8a98f; --house-sh:rgba(190,120,90,.18);
  --shadow:0 10px 28px rgba(190,120,90,.10);
  --radius:26px;
  --gut:clamp(20px,6vw,120px);
  --kai:"Fraunces","LXGW WenKai","Kaiti SC","STKaiti","PingFang SC",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#dcecfa; --card:#f7fbff; --sunk:#e9f3fc; --ink:#2b3d57; --mut:#6a82a0; --line:#c7dcf0;
    --accent:#6f9fd8; --petal:#f3a9c4; --petal-c:#f7d77a;
    --leaf:#8fd0b0; --stem:#6db893; --soil:#c3d6e8; --seed:#a8928a;
    --u:#f6c6d9; --u-bg:#fbe1eb; --u-ink:#a3426c;
    --p:#f2d98a; --p-bg:#fbf1c9; --p-ink:#7d6110;
    --g:#a9dcc4; --g-bg:#d9f2e6; --g-ink:#2e7155;
    --a:#a9b8ee; --a-bg:#dfe5fb; --a-ink:#3d53a6;
    --b:#9fd3df; --b-bg:#d5eef4; --b-ink:#1f6b79;
    --c:#f4c3a8; --c-bg:#fde5d8; --c-ink:#9a4a2e;
    --win-off:#c0d2e4; --win-on:#ffd86b; --house:#ffffff; --roof:#7fa8dc; --door:#a9c4e6; --house-sh:rgba(70,110,160,.22);
    --shadow:0 10px 28px rgba(70,110,160,.14);
  }
}
:root[data-theme="dark"]{
  --bg:#dcecfa; --card:#f7fbff; --sunk:#e9f3fc; --ink:#2b3d57; --mut:#6a82a0; --line:#c7dcf0;
    --accent:#6f9fd8; --petal:#f3a9c4; --petal-c:#f7d77a;
    --leaf:#8fd0b0; --stem:#6db893; --soil:#c3d6e8; --seed:#a8928a;
    --u:#f6c6d9; --u-bg:#fbe1eb; --u-ink:#a3426c;
    --p:#f2d98a; --p-bg:#fbf1c9; --p-ink:#7d6110;
    --g:#a9dcc4; --g-bg:#d9f2e6; --g-ink:#2e7155;
    --a:#a9b8ee; --a-bg:#dfe5fb; --a-ink:#3d53a6;
    --b:#9fd3df; --b-bg:#d5eef4; --b-ink:#1f6b79;
    --c:#f4c3a8; --c-bg:#fde5d8; --c-ink:#9a4a2e;
    --win-off:#c0d2e4; --win-on:#ffd86b; --house:#ffffff; --roof:#7fa8dc; --door:#a9c4e6; --house-sh:rgba(70,110,160,.22);
    --shadow:0 10px 28px rgba(70,110,160,.14);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;transition:background .3s}
.wrap{max-width:1800px;margin:0 auto;padding:36px var(--gut) 64px;position:relative}
svg{display:block}

header{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.house{width:240px;height:240px;object-fit:contain;flex:none;filter:drop-shadow(0 8px 12px var(--house-sh))}
.hbtn{position:relative;border:0;background:none;padding:0;cursor:pointer;flex:none;font:inherit;color:inherit}
.hbtn:focus-visible{outline:2px dashed var(--accent);outline-offset:4px;border-radius:20px}
.bubble{position:absolute;left:78%;top:-10px;z-index:5;white-space:nowrap;background:var(--card);color:var(--ink);font-size:13px;font-weight:700;padding:7px 13px;border-radius:16px;box-shadow:var(--shadow);opacity:0;transition:opacity .25s;pointer-events:none}
.bubble::after{content:"";position:absolute;left:10px;bottom:-6px;width:12px;height:12px;background:var(--card);border-radius:0 0 4px 0;transform:rotate(45deg)}
.bubble.show{opacity:1}
h1{font-family:var(--kai);font-size:48px;line-height:1.1;margin:0;font-weight:600;letter-spacing:.01em}
header>div{flex:1 1 220px;min-width:0}
header p{margin:8px 0 0;color:var(--mut);font-size:17px;max-width:560px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px;font-size:13.5px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:4px;border:3px solid;background:var(--win-off)}
.legend i.lit{background:var(--win-on)}
.acts{position:absolute;top:22px;right:var(--gut);display:flex;align-items:center;gap:8px;z-index:2}
.theme{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--card);color:var(--ink);border-radius:999px;padding:9px 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
.theme svg{width:16px;height:16px}

.stats{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;margin:26px 0 24px;padding:14px 2px 0;border-top:1px solid var(--line);font-size:14px;color:var(--mut)}
.stats b{font-family:var(--kai);font-size:24px;font-weight:500;color:var(--ink);margin-right:5px;font-variant-numeric:tabular-nums}
.stats .fav b{font-size:17px}
.stats .warn{border:0;background:none;padding:0;font:inherit;color:var(--a-ink);cursor:pointer;display:inline-flex;align-items:baseline;gap:5px}
.stats .warn b{color:var(--a-ink)}
.stats .warn:hover span{text-decoration:underline;text-underline-offset:3px}

.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.sbox{flex:1 1 220px;min-width:0;position:relative}
.sbox svg{position:absolute;left:15px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.search{width:100%;border:2px solid transparent;background:var(--card);color:var(--ink);border-radius:999px;padding:10px 16px 10px 40px;font:inherit;outline:none;box-shadow:var(--shadow)}
.search:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;border-radius:10px;padding:5px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;background:transparent;color:var(--mut);display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--src);opacity:.35}
.chip.on{color:var(--ink);background:var(--card);box-shadow:var(--shadow)}
.chip.on i{opacity:1}
.chip span{color:var(--mut);font-weight:500}
#proj{max-width:210px;text-overflow:ellipsis}
select.sort{border:0;background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit;font-size:13px;font-weight:700;box-shadow:var(--shadow)}
.tag{font-size:11.5px;padding:2px 10px;border-radius:999px;white-space:nowrap;font-weight:700}
.tag.s-user{background:var(--u-bg);color:var(--u-ink)}
.tag.s-project{background:var(--p-bg);color:var(--p-ink)}
.tag.s-plugin{background:var(--g-bg);color:var(--g-ink)}
.tag.s-anthropic{background:var(--a-bg);color:var(--a-ink)}
.tag.s-builtin{background:var(--b-bg);color:var(--b-ink)}
.tag.s-codex{background:var(--c-bg);color:var(--c-ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px 18px}
.card{--src:var(--u);background:var(--card);border-radius:var(--radius);padding:16px 18px 14px;box-shadow:0 6px 0 var(--src),var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:6px;border:2px solid transparent;text-align:left;font:inherit;color:inherit;transition:transform .2s,box-shadow .2s;animation:pop .45s backwards}
.card.s-project{--src:var(--p)} .card.s-plugin{--src:var(--g)} .card.s-anthropic{--src:var(--a)} .card.s-builtin{--src:var(--b)} .card.s-codex{--src:var(--c)}
.card:hover{box-shadow:0 6px 0 var(--src),0 14px 32px var(--house-sh)}
.pot{position:relative;height:128px;margin:-6px -6px 4px;display:grid;place-items:end center;border-radius:20px}
.pot .plant{width:84px;height:84px;margin:0 0 10px}
.pimg{width:124px;height:124px;object-fit:contain;filter:drop-shadow(0 7px 6px var(--house-sh))}
.dh .pimg{width:76px;height:76px;margin:-6px 0 -4px}
.viewsw{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px}
.viewsw button{border:0;background:transparent;color:var(--mut);font:inherit;font-size:13px;font-weight:700;border-radius:9px;padding:5px 12px;cursor:pointer}
.viewsw button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px var(--house-sh)}
.farm{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px 6px;background:var(--card);border-radius:30px;padding:18px 16px 20px;box-shadow:var(--shadow)}
.plot{border:0;background:transparent;font:inherit;color:inherit;cursor:pointer;padding:0 2px 6px;display:flex;flex-direction:column;align-items:center;border-radius:18px;transition:background-color .2s;animation:pop .45s backwards;min-width:0}
.plot:hover{background-color:var(--sunk)}
.plot:focus-visible{outline:2px dashed var(--accent)}
.plot .pimg{width:112px;height:112px}
.plot b{font-family:var(--kai);font-size:13.5px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.plot small{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:4px}
.plot small i{width:7px;height:7px;border-radius:50%;background:var(--src)}
.card:focus-visible{outline:none;border-color:var(--accent)}
@keyframes pop{from{opacity:0}}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.plant{width:48px;height:48px;flex:none;margin:-4px -4px 0 0;transition:transform .3s;transform-origin:50% 90%}
.card h3{margin:0;font-family:var(--kai);font-size:18px;font-weight:600;word-break:break-word}
.card p{margin:0;color:var(--mut);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.use{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;margin-top:auto;padding-top:6px}
.use b{font-weight:600} .use .when{color:var(--mut)}
.stage{color:var(--mut);font-weight:500}
.card.sleep{box-shadow:0 6px 0 var(--line),var(--shadow)}
.card.sleep h3,.card.sleep p{opacity:.62}
.sleepy{color:var(--mut);font-style:italic}
.tagbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-8px 0 20px;font-size:12.5px;color:var(--mut)}
.tagbar button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:700;border-radius:999px;padding:3px 11px;cursor:pointer}
.tagbar button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.src{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-bottom:-2px;min-width:0}
.src i{width:8px;height:8px;border-radius:50%;background:var(--src);flex:none}
.src span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert{position:absolute;right:2px;top:2px;width:26px;height:26px;border-radius:50%;background:var(--a-bg);color:var(--a-ink);display:grid;place-items:center;z-index:1}
.alert svg{width:15px;height:15px}
.plot{position:relative}
.plot .alert{right:10px;top:6px;width:22px;height:22px}
.fix{margin:8px 0 2px;padding-left:18px;color:var(--ink);font-size:13px}
.fix li{margin:3px 0}
.fixh{display:block;margin-top:8px;font-size:12px;font-weight:600;color:var(--mut)}
.wact{margin-top:8px}
.w.ignored{opacity:.6}
.w.ignored::before{background:var(--line)}
.note{font-size:12.5px;display:flex;align-items:center;gap:5px}
.note svg{width:13px;height:13px;flex:none}
.note.warn{color:var(--a-ink)} .note.up{color:var(--g-ink)}
.hint{color:var(--mut);font-size:12px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px}

section.extra{margin-top:40px}
section.extra h2{display:flex;align-items:center;gap:8px;font-family:var(--kai);font-size:20px;font-weight:600;margin:0 0 12px}
section.extra h2 svg{width:20px;height:20px;color:var(--accent)}
.wlist{display:flex;flex-direction:column;gap:10px}
.w{background:var(--card);border-radius:18px;padding:11px 16px 11px 20px;box-shadow:var(--shadow);font-size:13.5px;position:relative;overflow:hidden}
.w::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.w .k{font-weight:600;margin-right:8px}
.tl{list-style:none;margin:0;padding:0 0 0 6px;max-width:680px;background:var(--card);border-radius:22px;padding:8px 20px 12px 26px;box-shadow:var(--shadow)}
.tl .day{font-size:12.5px;font-weight:600;color:var(--mut);margin:10px 0 2px}
.tl li.ev{position:relative;padding:5px 0 5px 20px;font-size:13.5px;display:flex;gap:8px;align-items:baseline;min-width:0}
.tl li.ev::before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;border-radius:50%;background:var(--src,var(--line));box-shadow:0 0 0 3px var(--bg)}
.tl li.ev::after{content:"";position:absolute;left:4px;top:21px;bottom:-9px;width:2px;background:var(--line)}
.tl .t{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
.tl .nm{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tl .nm:hover{color:var(--accent)} .tl span.nm{cursor:default}
.tl .pj{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.more{margin-top:8px;border:2px solid var(--line);background:transparent;color:var(--mut);border-radius:999px;padding:4px 14px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.ghosts{display:flex;flex-wrap:wrap;gap:8px}
.ghost{border:2px solid var(--line);color:var(--mut);border-radius:999px;padding:4px 13px;font-size:13px}
.ghost b{color:var(--ink);font-weight:700}

dialog{border:0;border-radius:30px;padding:0;width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 48px);background:var(--card);color:var(--ink);box-shadow:0 24px 60px rgba(80,40,30,.28)}
dialog::backdrop{background:rgba(60,80,110,.35);backdrop-filter:blur(2px)}
dialog[open]{animation:pop .3s}
.dh{padding:20px 22px 10px;display:flex;gap:12px;align-items:flex-start}
.dh .plant{width:56px;height:56px;margin:0}
.dh h2{margin:0;font-family:var(--kai);font-size:22px;font-weight:600;word-break:break-word}
.dh button{margin-left:auto;border:0;background:var(--sunk);color:var(--ink);width:36px;height:36px;border-radius:50%;cursor:pointer;flex:none;display:grid;place-items:center}
.dh button svg{width:16px;height:16px}
.db{padding:0 22px 22px;overflow:auto;max-height:calc(100vh - 150px)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:8px 0 14px}
.kv dt{color:var(--mut)} .kv dd{margin:0;word-break:break-all}
.desc{background:var(--sunk);border-radius:18px;padding:12px 14px;font-size:14px;margin-bottom:12px}
pre{background:var(--sunk);border-radius:18px;padding:14px;font:12.5px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;margin:0}
.copy{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:3px 12px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
footer{color:var(--mut);font-size:12px;margin-top:44px;text-align:center}
@media (max-width:520px){h1{font-size:34px}header p{font-size:15px}.house{width:170px;height:170px}.stat.fav b{font-size:14.5px}.acts{top:14px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <button type="button" class="hbtn" id="hbtn" data-ia="poke"><img class="house" id="house" alt="" data-ia="houseAria"><span class="bubble" id="bubble" role="status"></span></button>
  <div>
    <h1 data-i="title"></h1>
    <p id="sub"></p>
    <div class="legend" id="legend"></div>
  </div>
  <div class="acts"><div class="viewsw" role="group" data-ia="viewAria"><button type="button" data-v="cards" data-i="cards"></button><button type="button" data-v="farm" data-i="farm"></button></div><button class="theme" id="lang" type="button"></button><button class="theme" id="theme" type="button" data-ia="themeAria"></button></div>
</header>

<div class="stats" id="stats"></div>

<div class="bar">
  <label class="sbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="search" id="q" type="search" data-ip="search" data-ia="searchAria"></label>
  <div class="chips" id="chips"></div>
  <select class="sort" id="proj" data-ia="projAria"></select>
  <select class="sort" id="sort" data-ia="sortAria">
    <option value="uses" data-i="sort.uses"></option>
    <option value="recent" data-i="sort.recent"></option>
    <option value="name" data-i="sort.name"></option>
    <option value="modified" data-i="sort.modified"></option>
  </select>
</div>

<div class="tagbar" id="tagbar"></div>

<div class="grid" id="grid"></div>

<section class="extra" id="recentSec">
  <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span data-i="recentH"></span></h2>
  <ol class="tl" id="recent"></ol>
  <button type="button" class="more" id="moreRecent" hidden></button>
</section>

<section class="extra" id="warnSec">
  <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 2.4 17.5A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg><span data-i="warnH"></span></h2>
  <div class="wlist" id="warns"></div>
</section>

<section class="extra" id="ghostSec">
  <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-i="ghostH"></span></h2>
  <p style="color:var(--mut);font-size:13px;margin:-4px 0 10px" data-i="ghostP"></p>
  <div class="ghosts" id="ghosts"></div>
</section>

<footer id="foot"></footer>
</div>

<dialog id="dlg" aria-labelledby="dTitle">
  <div class="dh"><span id="dPlant"></span><div><h2 id="dTitle"></h2><div id="dTags" style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"></div></div><button type="button" id="dClose" data-ia="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="db" id="dBody"></div>
</dialog>

<script>
const DATA = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const I18N = {
  zh: {
    title:"Skill 农场", sub:"你电脑上所有的 Claude skill 都种在这里，用得越多长得越好",
    poke:"戳一下温室", houseAria:"农场的小温室",
    themeAria:"切换配色", toPeach:"换成蜜桃", toBlue:"换成天蓝", langBtn:"EN", langAria:"Switch to English",
    search:"搜名字或描述…", searchAria:"搜索 skill", viewAria:"显示方式", cards:"卡片", farm:"农场",

function trim(img){
  // pull the image out by its transparent margins so the drawing itself lines up with the cards
  try {
    const c = document.createElement("canvas"), w = c.width = img.naturalWidth, h = c.height = img.naturalHeight, x = c.getContext("2d");
    x.drawImage(img, 0, 0);
    const d = x.getImageData(0, 0, w, h).data;
    let l = w, r = 0, tp = h, b = 0;
    for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) if (d[(y * w + i) * 4 + 3] > 20){ if (i < l) l = i; if (i > r) r = i; if (y < tp) tp = y; if (y > b) b = y; }
    const k = img.clientWidth / w;
    img.style.margin = `${-tp * k}px ${-(w - 1 - r) * k}px ${-(h - 1 - b) * k}px ${-l * k}px`;
  } catch(e){}
}

    return;
  }
  $("#grid").innerHTML = L.length ? L.map((s, i) => {
    const w = warnNote(s);
    return `<button type="button" class="card s-${s.source} ${s.uses ? "" : "sleep"}" data-id="${esc(s.id)}" style="animation-delay:${Math.min(i, 14) * 30}ms">
      <div class="pot">${pot(s)}${w ? `<span class="alert" title="${esc(w.text)}" aria-label="${esc(w.short)}">${BANG}</span>` : ""}</div>
      <div class="src"><i></i><span>${[t.src[s.source], ...s.tags.map(tg)].map(esc).join(" · ")}</span></div>
      <h3>${esc(s.name)}</h3>
      <p>${esc(desc(s) || t.noDesc)}</p>
      ${s.update ? `<div class="note up" title="${esc(t.updDetail(s.update))}">${UP}${esc(t.updShort(s.update))}</div>` : ""}
      <div class="use">${s.uses ? `<b>${t.used(s.uses)}</b><span class="when">${ago(s.last_used)}</span>` : `<span class="sleepy">${t.never}</span>`}</div>
    </button>`;
  }).join("") : `<div class="empty">${t.empty}</div>`;
  document.querySelectorAll(".card").forEach(c => c.onclick = () => open(c.dataset.id));
}

function open(id){
  const s = DATA.skills.find(x => x.id === id);
  $("#dTitle").textContent = s.invoke;
  $("#dPlant").innerHTML = pot(s);
  $("#dTags").innerHTML = `<div class="src" style="--src:var(--${VAR[s.source]})"><i></i><span>${t.src[s.source]} · ${s.uses ? t.used(s.uses) : t.never}</span></div>`;
  const W = DATA.warnings.filter(w => w.skills.includes(id));
  $("#dBody").innerHTML = `
    ${W.map(w => warnBlock(w, 'style="margin-bottom:8px"', s.invoke)).join("")}
    <div class="desc">${esc(desc(s) || t.noDesc)}</div>
    <dl class="kv">
      <dt>${t.kv.invoke}</dt><dd>${esc(s.invoke)}</dd>
      <dt>${t.kv.scope}</dt><dd>${esc(t.scope(s.scope))}</dd>
      <dt>${t.kv.path}</dt><dd>${esc(s.path || t.noFile)} ${s.dir ? `<button class="copy" type="button" id="cp">${t.copy}</button>` : ""}</dd>
      ${s.update ? `<dt>${t.kv.update}</dt><dd>${esc(t.updDetail(s.update))}</dd>` : ""}
      ${s.linked ? `<dt>${t.kv.linked}</dt><dd>${esc(s.linked)}</dd>` : ""}
      ${s.modified ? `<dt>${t.kv.modified}</dt><dd>${esc(s.modified.replace("T"," "))}</dd>` : ""}
      ${s.plant ? `<dt>${t.kv.plant}</dt><dd>${esc(pname(s))} <span class="hint">· ${t.farmHint}</span></dd>` : ""}
      <dt>${t.kv.tags}</dt><dd>${s.tags.length ? s.tags.map(tg).map(esc).join(" · ") : t.noTags} <span class="hint">· ${t.tagsHint}</span></dd>
      ${s.used_in.length ? `<dt>${t.kv.usedIn}</dt><dd>${s.used_in.map(esc).join(" · ")}</dd>` : ""}
      <dt>${t.kv.last}</dt><dd>${s.last_used ? esc(s.last_used.slice(0,16).replace("T"," ")) + ` <span class="hint">· ${ago(s.last_used)}</span>` : "—"}</dd>
      ${s.lines ? `<dt>${t.kv.size}</dt><dd>${t.size(s.lines, s.files)}</dd>` : ""}
    </dl>
    <pre>${esc(s.bundled ? t.bundled : s.body)}</pre>`;
  if ($("#cp")) $("#cp").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(s.path); $("#cp").textContent = t.copied; };
  wireIgnore($("#dBody"), () => open(id));
  if (!$("#dlg").open) $("#dlg").showModal();
}
$("#dClose").onclick = () => $("#dlg").close();
$("#dlg").onclick = e => { if (e.target === $("#dlg")) $("#dlg").close(); };

let showAll = false;
function recent(){
  const R = DATA.recent || [];
  $("#recentSec").hidden = !R.length;
  const find = k => DATA.skills.find(s => s.invoke === k) || DATA.skills.find(s => s.name === k.split(":").pop());
  const dayOf = iso => { const d = new Date(iso), now = new Date(); const n = Math.round((new Date(now.toDateString()) - new Date(d.toDateString())) / 864e5);
    return n === 0 ? t.today : n === 1 ? t.yesterday : t.day(d); };
  let last = "", html = "";
  (showAll ? R : R.slice(0, 12)).forEach(e => {
    const d = dayOf(e.ts), s = find(e.invoke), tm = new Date(e.ts);
    if (d !== last){ html += `<li class="day">${d}</li>`; last = d; }
    const nm = s ? `<button type="button" class="nm" data-id="${esc(s.id)}">${esc(s.name)}</button>` : `<span class="nm">${esc(e.invoke)}</span>`;
    html += `<li class="ev" style="--src:var(--${s ? VAR[s.source] : "line"})"><span class="t">${String(tm.getHours()).padStart(2,"0")}:${String(tm.getMinutes()).padStart(2,"0")}</span>${nm}<span class="pj">${esc(e.project)}</span></li>`;
  });
  $("#recent").innerHTML = html;
  $("#recent").querySelectorAll("button.nm").forEach(b => b.onclick = () => open(b.dataset.id));
  const m = $("#moreRecent"); m.hidden = R.length <= 12;
  m.textContent = showAll ? t.showLess : t.showMore(R.length - 12);
  m.onclick = () => { showAll = !showAll; recent(); };
}

function extras(){
  const W = DATA.warnings;
  $("#warnSec").hidden = !W.length;
  $("#warns").innerHTML = W.map(w => warnBlock(w)).join("");
  wireIgnore($("#warns"));
  const G = DATA.ghosts;
  $("#ghostSec").hidden = !G.length;
  $("#ghosts").innerHTML = G.map(g => `<span class="ghost"><b>${esc(g.invoke)}</b> · ${t.ghostUses(g.uses)}${g.last_used ? " · " + ago(g.last_used) : ""}</span>`).join("");
}

const root = document.documentElement;
const SUN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
const MOON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>`;
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
function themeLabel(){ $("#theme").innerHTML = isDark() ? `${SUN}${t.toPeach}` : `${MOON}${t.toBlue}`; }
$("#theme").onclick = () => {
  root.dataset.theme = isDark() ? "light" : "dark"; themeLabel();
  try { localStorage.setItem("sb-theme", root.dataset.theme); } catch(e){}
};
try { const t = localStorage.getItem("sb-theme"); if (t) root.dataset.theme = t; } catch(e){}
if (QS.get("theme")) root.dataset.theme = QS.get("theme") === "blue" ? "dark" : "light";

function statics(){
  root.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = t.title;
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = pick(e.dataset.i));
  document.querySelectorAll("[data-ia]").forEach(e => e.setAttribute("aria-label", pick(e.dataset.ia)));
  document.querySelectorAll("[data-ip]").forEach(e => e.setAttribute("placeholder", pick(e.dataset.ip)));
  $("#sub").textContent = t.sub;
  $("#foot").textContent = t.foot(DATA.generated.replace("T"," "));
  $("#lang").textContent = t.langBtn; $("#lang").setAttribute("aria-label", t.langAria);
  themeLabel(); viewsw();
}
$("#lang").onclick = () => {
  lang = lang === "zh" ? "en" : "zh"; t = I18N[lang];
  try { localStorage.setItem("sb-lang", lang); } catch(e){}
  render();
};
let view = "cards";
try { view = localStorage.getItem("sb-view") || "cards"; } catch(e){}
if (QS.get("view")) view = QS.get("view");
function viewsw(){
  document.querySelectorAll(".viewsw button").forEach(b => { b.classList.toggle("on", b.dataset.v === view); b.setAttribute("aria-pressed", b.dataset.v === view);
    b.onclick = () => { view = b.dataset.v; try { localStorage.setItem("sb-view", view); } catch(e){} viewsw(); grid(); }; });
}
let tag = "";
const NOTAG = "\u0000none";
function tagbar(){
  const n = {};
  DATA.skills.forEach(s => s.tags.forEach(x => n[x] = (n[x] || 0) + 1));
  const T = Object.keys(n).sort((a,b) => n[b] - n[a]);
  $("#tagbar").hidden = !T.length;
  const untagged = DATA.skills.filter(s => !s.tags.length).length;
  $("#tagbar").innerHTML = `<span>${t.tagsLabel}</span>` + [["", t.all], ...T.map(x => [x, `${tg(x)} ${n[x]}`]), [NOTAG, `${t.untagged} ${untagged}`]]
    .map(([k, l]) => `<button type="button" data-t="${esc(k)}" class="${tag === k ? "on" : ""}" aria-pressed="${tag === k}">${esc(l)}</button>`).join("");
  $("#tagbar").querySelectorAll("button").forEach(b => b.onclick = () => { tag = tag === b.dataset.t ? "" : b.dataset.t; tagbar(); grid(); });
}
function projects(){
  const n = {};
  DATA.skills.forEach(s => s.used_in.forEach(p => n[p] = (n[p] || 0) + 1));
  const cur = $("#proj").value;
  $("#proj").innerHTML = `<option value="">${t.allProjects}</option>` + Object.keys(n).sort((a,b) => n[b] - n[a]).map(p => `<option value="${esc(p)}">${esc(p)} · ${n[p]}</option>`).join("");
  $("#proj").value = cur;
}
function render(){ statics(); house(); stats(); chips(); tagbar(); projects(); grid(); recent(); extras(); }
$("#q").oninput = grid; $("#sort").onchange = grid; $("#proj").onchange = grid;
render();
$("#hbtn").onclick = poke;
addEventListener("resize", () => { const img = $("#house"); if (img.complete && img.naturalWidth) trim(img); });
</script>
</body>
</html>
